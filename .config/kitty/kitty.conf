font_family      family="Berkeley Mono" style="Medium"
bold_font        family="Berkeley Mono" style="Medium"
italic_font      family="Berkeley Mono" style="Medium"
bold_italic_font family="Berkeley Mono" style="Medium"

font_size 13.0

# tab_bar_edge             bottom
# tab_bar_style            powerline
# tab_powerline_style      slanted
# tab_bar_background       #2D353B
#
# active_tab_foreground    #2D353B
# active_tab_background    #D3C6AA
# active_tab_font_style    bold
# inactive_tab_foreground  #D3C6AA
# inactive_tab_background  #2D353B
# inactive_tab_font_style  bold
#
# # grey.conf — kitty color theme matching the grey Neovim colorscheme
# Place in ~/.config/kitty/grey.conf and load with:
#   include grey.conf
# in your kitty.conf, or set it directly as your theme.

background            #161617
foreground            #c9c7cd
selection_background  #3b3b3e
selection_foreground  #c9c7cd
 
cursor                #c9c7cd
cursor_text_color     #161617
 
url_color             #92a2d5
 
active_border_color   #444448
inactive_border_color #2a2a2c
bell_border_color     #e6b99d
 
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_background      #131314
 
active_tab_foreground   #161617
active_tab_background   #c9c7cd
active_tab_font_style   bold
inactive_tab_foreground #c9c7cd
inactive_tab_background #131314
inactive_tab_font_style bold

tab_bar_min_tabs 2
window_padding_width 0

map ctrl+f launch --type=tab lw
map ctrl+t launch --type=tab --cwd=~

shell_integration no-cursor
cursor_shape block
cursor_blink_interval 0
enable_audio_bell no
