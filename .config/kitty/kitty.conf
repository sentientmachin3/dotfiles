font_family      family="Meslo LG S" style="Regular"
bold_font        family="Meslo LG S" style="Regular"
italic_font      family="Meslo LG S" style="Regular"
bold_italic_font family="Meslo LG S" style="Regular"

font_size 13

foreground                      #e2cca9
background                      #282828
selection_foreground            #e2cca9
selection_background            #45403d
 
cursor                          #e2cca9
cursor_text_color               #282828
 
url_color                       #80aa9e
active_border_color             #a89984
inactive_border_color           #45403d
bell_border_color               #e9b143
 
wayland_titlebar_color          system
 
tab_bar_style                   separator
tab_separator                   ""
tab_title_template              " {index}: {tab.active_exe} "
active_tab_title_template       " {index}: {tab.active_exe} "
 
active_tab_foreground           #282828
active_tab_background           #b0b846
inactive_tab_foreground         #a89984
inactive_tab_background         #282828
tab_bar_background              #282828


enabled_layouts splits
tab_bar_min_tabs 2
window_padding_width 0

map ctrl+t launch --type=tab --cwd=~
map ctrl+e launch --location=vsplit --cwd=current
map ctrl+o launch --location=hsplit --cwd=current
map ctrl+] next_window

shell_integration no-cursor
cursor_shape block
cursor_blink_interval 0
enable_audio_bell no
