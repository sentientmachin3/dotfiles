font_family      family="Berkeley Mono" style="Medium"
bold_font        family="Berkeley Mono" style="Medium"
italic_font      family="Berkeley Mono" style="Medium"
bold_italic_font family="Berkeley Mono" style="Medium"

font_size 13.0

# tab_bar_edge             bottom
# tab_bar_style            powerline
# tab_powerline_style      slanted
# tab_bar_background       #2D353B
#
# active_tab_foreground    #2D353B
# active_tab_background    #D3C6AA
# active_tab_font_style    bold
# inactive_tab_foreground  #D3C6AA
# inactive_tab_background  #2D353B
# inactive_tab_font_style  bold
#
# # grey.conf — kitty color theme matching the grey Neovim colorscheme
# Place in ~/.config/kitty/grey.conf and load with:
#   include grey.conf
# in your kitty.conf, or set it directly as your theme.

foreground                      #e2cca9
background                      #282828
selection_foreground            #e2cca9
selection_background            #45403d
 
cursor                          #e2cca9
cursor_text_color               #282828
 
url_color                       #80aa9e
active_border_color             #a89984
inactive_border_color           #45403d
bell_border_color               #e9b143
 
wayland_titlebar_color          system
 
tab_bar_style                   separator
tab_separator                   ""
tab_title_template              " {index}: {tab.active_exe} "
active_tab_title_template       " {index}: {tab.active_exe} "
 
active_tab_foreground           #282828
active_tab_background           #b0b846
inactive_tab_foreground         #a89984
inactive_tab_background         #282828
tab_bar_background              #282828


tab_bar_min_tabs 2
window_padding_width 0

map ctrl+f launch --type=tab lw
map ctrl+t launch --type=tab --cwd=~

shell_integration no-cursor
cursor_shape block
cursor_blink_interval 0
enable_audio_bell no
