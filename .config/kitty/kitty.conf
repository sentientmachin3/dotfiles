font_family      family="Berkeley Mono" style="Medium"
bold_font        family="Berkeley Mono" style="Medium"
italic_font      family="Berkeley Mono" style="Medium"
bold_italic_font family="Berkeley Mono" style="Medium"

font_size 13.0
background #2D353B
foreground #D3C6AA

# tab_bar_edge             bottom
# tab_bar_style            powerline
# tab_powerline_style      slanted
# tab_bar_background       #2D353B
#
# active_tab_foreground    #2D353B
# active_tab_background    #D3C6AA
# active_tab_font_style    bold
# inactive_tab_foreground  #D3C6AA
# inactive_tab_background  #2D353B
# inactive_tab_font_style  bold
#
# # grey.conf — kitty color theme matching the grey Neovim colorscheme
# Place in ~/.config/kitty/grey.conf and load with:
#   include grey.conf
# in your kitty.conf, or set it directly as your theme.

# ── Core ──────────────────────────────────────────────────────────────────────
background            #252525
foreground            #d4d4d4
selection_background  #434343
selection_foreground  #e8e8e8

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor                #d4d4d4
cursor_text_color     #252525

# ── URL ───────────────────────────────────────────────────────────────────────
url_color             #868686

# ── Window / Tab borders ──────────────────────────────────────────────────────
active_border_color   #515151
inactive_border_color #383838
bell_border_color     #999966
 
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_background      #252525
 
active_tab_foreground   #252525
active_tab_background   #d4d4d4
active_tab_font_style   bold
inactive_tab_foreground #d4d4d4
inactive_tab_background #252525
inactive_tab_font_style bold


# ── Marks ─────────────────────────────────────────────────────────────────────
mark1_foreground #252525
mark1_background #a8a8a8
mark2_foreground #252525
mark2_background #868686
mark3_foreground #252525
mark3_background #606060

# ── 16 ANSI colors ────────────────────────────────────────────────────────────
# Normal (0-7) — spread across the bg/fg scale
color0  #252525
color1  #cc6666
color2  #88aa88
color3  #999966
color4  #8899aa
color5  #a8a8a8
color6  #6a8a7a
color7  #d4d4d4

# Bright (8-15) — one step brighter than their normal counterparts
color8  #515151
color9  #d47f7f
color10 #aabbaa
color11 #bbbb88
color12 #99aabb
color13 #c0c0c0
color14 #88aa99
color15 #e8e8e8

tab_bar_min_tabs 2
window_padding_width 0

map ctrl+f launch --type=tab lw
map ctrl+t launch --type=tab --cwd=~

shell_integration no-cursor
cursor_shape block
cursor_blink_interval 0
enable_audio_bell no
