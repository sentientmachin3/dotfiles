<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <match target="font">
        <edit name="antialias" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="rgba" mode="assign">
            <const>rgb</const>
        </edit>
    </match>

    <!-- Monospace -->
    <match target="pattern">
        <test name="family">
            <string>monospace</string>
        </test>
        <edit name="family" mode="prepend">
            <string>Berkeley Mono</string>
        </edit>
    </match>

    <!-- Sans-serif -->
    <match target="pattern">
        <test name="family">
            <string>sans</string>
        </test>
        <edit name="family" mode="prepend">
            <string>Ubuntu Nerd Font</string>
        </edit>
    </match>

    <!-- Sans-serif -->
    <match target="pattern">
        <test name="family">
            <string>sans-serif</string>
        </test>
        <edit name="family" mode="prepend">
            <string>Ubuntu Nerd Font</string>
        </edit>
    </match>
</fontconfig>
