[bar]
order = [ "main" ]

    [bar.default]
    border = "primary"
    capsule = false
    center = [ "active_window" ]
    compositor_blur = false
    contact_shadow = false
    end = [ "tray", "network", "bluetooth", "volume", "battery", "clock" ]
    font_family = "Berkeley Mono Medium"
    font_weight = 700
    hover_highlight = false
    margin_ends = 0
    padding = 0
    radius = 2
    scale = 1.1000000000000001
    shadow = false
    start = [ "workspaces", "media" ]

[control_center]
hidden_tabs = [ "weather" ]

    [control_center.media]
    show_visualizer = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-3"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
force = true
temperature_day = 4800
temperature_night = 6000

[notification]
keep_dismissed_in_history = false

[shell]
corner_radius_scale = 0.70000001043081284
font_family = "Rubik"
popup_shadows = false

    [shell.animation]
    enabled = false

    [shell.launcher]
    categories = false
    compact = true
    fetch_exchange_rates = false
    layout = "simple"
    show_app_origin_indicator = false
    track_usage = false

    [shell.screen_corners]
    size = 27

    [shell.screenshot]
    copy_to_clipboard = false
    directory = "/home/davide"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Gruvbox"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/usr/share/backgrounds"

    [wallpaper.default]
    path = "/usr/share/backgrounds/forest.png"

    [wallpaper.last]
    path = "/usr/share/backgrounds/forest.png"

    [wallpaper.monitors.DP-3]
    path = "/usr/share/backgrounds/forest.png"

[weather]
enabled = false
