prompt = '> '
padding = 200
fonts = [ 'Berkeley Mono Semibold' ]
font_size = 20

[history]
decrease_interval = 48

[colors]
background = '#161617'
prompt = '#c9c7cd'
text_query = '#c9c7cd'
text = '#88aa88'      # for search results
text_selected= '#c9c7cd'# for the currently selected result

[keybindings]
paste = ["ctrl+v"]
execute = ["KP_Enter", "Return"]
delete = ["Delete", "BackSpace"]
delete_word = ["ctrl+w"]
complete = ["Tab"]
nav_up = ["ctrl+p", "Up"]
nav_down = ["ctrl+n", "Down"]
exit = ["ctrl+c", "Escape"]
